<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لوحة التاجر — سوق السودان</title>
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="core.css">
<link rel="stylesheet" href="enhance.css">
<link rel="stylesheet" href="dashboard.css">
<link rel="stylesheet" href="theme.css">
<link rel="icon" type="image/png" href="assets/icons/icon-192.png">
</head>
<body>
<div id="loading" class="access-denied"><div class="spinner spinner-dark" style="width:36px;height:36px"></div></div>
<div id="denied" class="access-denied" style="display:none"><div class="card"><div style="font-size:3rem">🔒</div><h2>الوصول مرفوض</h2><p class="muted">هذه الصفحة مخصصة لأصحاب المتاجر والطاقم المصرح لهم فقط.</p><a href="index.html" class="btn">العودة للرئيسية</a></div></div>
<div id="dashApp" class="dash-layout" style="display:none">
  <aside class="dash-sidebar" id="sidebar"><div class="brand"><span class="logo-dot">س</span> سوق السودان</div><div class="store-chip"><div><div class="name" id="chipName">—</div><div class="tiny" id="chipRole">—</div></div></div><nav class="dash-nav"><a href="#" data-section="overview" class="active">📊 نظرة عامة</a><a href="#" data-section="products">📦 المنتجات</a><a href="#" data-section="orders">🧾 الطلبات</a><a href="#" data-section="branding">🎨 الهوية والإعدادات</a></nav><a href="index.html">← العودة للرئيسية</a></aside>
  <main class="dash-main"><div class="dash-top"><h1 id="pageTitle">نظرة عامة</h1><button class="btn btn-ghost btn-sm" onclick="doLogout()">خروج</button></div><div id="noStore" class="hide"><div class="card center"><h2>لم تنشئ متجرك بعد</h2><button class="btn" onclick="openCreateStore()">إنشاء متجر الآن</button></div></div><div id="sections"></div></main>
</div>
<div class="modal-overlay" id="modal"><div class="modal modal-wide" id="modalBody"></div></div>
<div class="toast-wrap" id="toastWrap"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
<script>
const firebaseConfig={apiKey:"AIzaSyAxocPULi4vcrm8t8Q3wYrHQ9oWovHXrV4",authDomain:"daman-7f169.firebaseapp.com",projectId:"daman-7f169",storageBucket:"daman-7f169.firebasestorage.app",messagingSenderId:"981649500667",appId:"1:981649500667:web:7709753041388518b6035e",measurementId:"G-L5PDZL05FT"};firebase.initializeApp(firebaseConfig);const auth=firebase.auth(),db=firebase.firestore();
const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s);function toast(m,t='ok'){const w=$('#toastWrap'),e=document.createElement('div');e.className='toast '+t;e.textContent=m;w.appendChild(e);setTimeout(()=>e.remove(),3000)}let state={user:null,profile:null,storeId:null,store:null,products:[],orders:[]};
async function gate(u){if(!u){location.replace('index.html?login=1');return}state.user=u;const p=await db.collection('users').doc(u.uid).get();state.profile=p.exists?p.data():{role:'buyer'};if(!['merchant','staff','buyer','super_admin','platform_moderator'].includes(state.profile.role)){showDenied();return}const owned=await db.collection('stores').where('ownerUid','==',u.uid).limit(1).get();if(!owned.empty){state.storeId=owned.docs[0].id;state.store=owned.docs[0].data();bootDashboard()}else{showNoStore()}}
function showDenied(){ $('#loading').style.display='none';$('#dashApp').style.display='none';$('#denied').style.display='grid'}function showNoStore(){ $('#loading').style.display='none';$('#dashApp').style.display='grid';$('#noStore').classList.remove('hide');$('#chipName').textContent=state.profile.displayName||'تاجر';$('#chipRole').textContent='بدون متجر'}
async function bootDashboard(){ $('#loading').style.display='none';$('#dashApp').style.display='grid';$('#chipName').textContent=state.store.name||'متجري';$('#chipRole').textContent='المالك';const sRef=db.collection('stores').doc(state.storeId),[prod,ord]=await Promise.all([sRef.collection('products').get(),sRef.collection('orders').get()]);state.products=prod.docs.map(d=>({id:d.id,...d.data()}));state.orders=ord.docs.map(d=>({id:d.id,...d.data()}));switchSection('overview')}
function switchSection(sec){$$('.dash-nav a').forEach(a=>a.classList.toggle('active',a.dataset.section===sec));const w=$('#sections');if(sec==='overview')w.innerHTML='<div class="stats-grid"><div class="stat-card"><div class="label">المنتجات</div><div class="value">'+state.products.length+'</div></div><div class="stat-card"><div class="label">الطلبات</div><div class="value">'+state.orders.length+'</div></div></div>';else w.innerHTML='<p>القسم متاح في النسخة الكاملة.</p>'}
function openCreateStore(){ $('#modalBody').innerHTML='<div class="modal-head"><h3>إنشاء متجر</h3><button class="icon-btn" onclick="closeModal()">✕</button></div><div class="field"><label>اسم المتجر</label><input class="input" id="nsName"></div><div class="field"><label>الرابط</label><input class="input" id="nsSlug"></div><button class="btn btn-block" onclick="createStore()">إنشاء</button>';$('#modal').classList.add('show')}
async function createStore(){const name=$('#nsName').value.trim(),slug=$('#nsSlug').value.trim().toLower.toLower?$('#nsSlug').value.trim().toLower():$('#nsSlug').value.trim().toLowerCase();if(!name||!/^[a-z0-9-]+$/.test(slug)){toast('أكمل البيانات بصورة صحيحة','warn');return}await db.collection('stores').add({ownerUid:state.user.uid,name,slug,currency:'SDG',plan:'free',status:'active',verified:false,featured:false,theme:'classic',accentColor:'#4f46e5',createdAt:firebase.firestore.FieldValue.serverTimestamp()});await db.collection('users').doc(state.user.uid).update({role:'merchant'});location.reload()}
function closeModal(){ $('#modal').classList.remove('show')}async function doLogout(){await auth.signOut();location.href='index.html'}auth.onAuthStateChanged(u=>gate(u));
</script>
<script src="ui.js"></script><script src="icons.js"></script>
</body>
</html>
