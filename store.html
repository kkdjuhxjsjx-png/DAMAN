<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>متجر — سوق السودان</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://www.gstatic.com" crossorigin><link rel="preconnect" href="https://firestore.googleapis.com" crossorigin><link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/core.css">
<link rel="stylesheet" href="css/enhance.css">
<link rel="stylesheet" href="css/store.css">
<link rel="stylesheet" href="css/theme.css">
<link rel="icon" type="image/png" href="assets/icons/icon-192.png">
<link rel="apple-touch-icon" href="assets/icons/icon-192.png">
</head>
<body class="theme-classic">

<div id="offlineBanner" class="banner banner-warn hide">⚠️ أنت غير متصل</div>

<header class="site-header">
  <div class="container">
    <a href="index.html" class="brand"><span class="logo-dot">س</span> سوق السودان</a>
    <div class="nav-links">
      <button class="btn btn-ghost btn-sm" id="btnAuth" onclick="openAuth()">دخول</button>
      <button class="btn btn-ghost btn-sm" id="btnLogout" style="display:none" onclick="doLogout()">خروج</button>
      <button class="icon-btn" id="cartToggle" aria-label="السلة" style="display:none" onclick="openCart()">🛒</button>
    </div>
  </div>
</header>

<main id="app">
  <div class="skeleton sk-hero"></div><div class="container"><div class="grid grid-3"><div class="card sk-card skeleton"></div><div class="card sk-card skeleton"></div><div class="card sk-card skeleton"></div></div></div>
</main>

<button class="cart-fab" id="cartFab" style="display:none" onclick="openCart()">🛒 السلة <span class="count" id="cartCount">0</span></button>

<div class="cart-drawer" id="cartDrawer">
  <div class="head"><h3 style="margin:0">سلة المشتريات</h3><button class="icon-btn" onclick="closeCart()">✕</button></div>
  <div class="items" id="cartItems"></div>
  <div class="foot">
    <div class="row-between mb-2"><span>الإجمالي</span><strong id="cartTotal">0</strong></div>
    <button class="btn btn-block" id="checkoutBtn" onclick="startCheckout()">إتمام الشراء</button>
  </div>
</div>

<div class="modal-overlay" id="productModal">
  <div class="modal" id="productModalBody"></div>
</div>

<div class="modal-overlay" id="checkoutModal">
  <div class="modal modal-wide" id="checkoutBody"></div>
</div>

<!-- ✅ Auth modal with Google Sign-In -->
<div class="modal-overlay" id="authModal">
  <div class="modal">
    <div class="modal-head"><h3>تسجيل الدخول / إنشاء حساب</h3><button class="icon-btn" onclick="closeAuth()">✕</button></div>

    <button class="btn btn-google btn-block" onclick="signInWithGoogle()" id="googleBtn">
      <svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
      </svg>
      المتابعة باستخدام جوجل
    </button>

    <div class="auth-divider"><span>أو</span></div>

    <div class="tabs">
      <button class="tab active" id="tabLogin" onclick="switchAuthTab('login')">دخول</button>
      <button class="tab" id="tabRegister" onclick="switchAuthTab('register')">حساب جديد</button>
    </div>
    <form id="loginForm" onsubmit="return doLogin(event)">
      <div class="field"><label>البريد الإلكتروني</label><input class="input" type="email" id="loginEmail" required></div>
      <div class="field"><label>كلمة المرور</label><input class="input" type="password" id="loginPassword" required></div>
      <button class="btn btn-block" type="submit" id="loginBtn">دخول</button>
    </form>
    <form id="registerForm" class="hide" onsubmit="return doRegister(event)">
      <div class="field"><label>الاسم الكامل</label><input class="input" id="regName" required></div>
      <div class="field"><label>البريد الإلكتروني</label><input class="input" type="email" id="regEmail" required></div>
      <div class="field"><label>كلمة المرور</label><input class="input" type="password" id="regPassword" required minlength="6"></div>
      <button class="btn btn-block" type="submit" id="regBtn">إنشاء الحساب</button>
    </form>
  </div>
</div>

<div class="modal-overlay" id="reviewModal">
  <div class="modal">
    <div class="modal-head"><h3>أضف تقييمك</h3><button class="icon-btn" onclick="closeReview()">✕</button></div>
    <div class="field"><label>التقييم</label>
      <select class="input" id="reviewRating"><option value="5">★★★★★ ممتاز</option><option value="4">★★★★ جيد جدًا</option><option value="3">★★★ جيد</option><option value="2">★★ مقبول</option><option value="1">★ سيئ</option></select>
    </div>
    <div class="field"><label>تعليق</label><textarea class="input" id="reviewComment" placeholder="شاركنا تجربتك..."></textarea></div>
    <button class="btn btn-block" onclick="submitReview()">إرسال التقييم</button>
  </div>
</div>

<div class="modal-overlay" id="reportModal">
  <div class="modal">
    <div class="modal-head"><h3>الإبلاغ عن مشكلة</h3><button class="icon-btn" onclick="closeReport()">✕</button></div>
    <div class="field"><label>السبب</label>
      <select class="input" id="reportReason">
        <option value="fraud">احتيال / نصب</option>
        <option value="abuse">محتوى مسيء</option>
        <option value="counterfeit">منتج مزيف</option>
        <option value="spam">إزعاج / سبام</option>
        <option value="other">أخرى</option>
      </select>
    </div>
    <div class="field"><label>تفاصيل إضافية</label><textarea class="input" id="reportDetails" placeholder="اشرح المشكلة..."></textarea></div>
    <button class="btn btn-block btn-danger" onclick="submitReport()">إرسال البلاغ</button>
  </div>
</div>

<div class="toast-wrap" id="toastWrap"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
<script>
/* ============================================================
   ✅ Firebase config — updated with your real project
   ============================================================ */
const firebaseConfig = {
  apiKey: "AIzaSyAxocPULi4vcrm8t8Q3wYrHQ9oWovHXrV4",
  authDomain: "daman-7f169.firebaseapp.com",
  projectId: "daman-7f169",
  storageBucket: "daman-7f169.firebasestorage.app",
  messagingSenderId: "981649500667",
  appId: "1:981649500667:web:7709753041388518b6035e",
  measurementId: "G-L5PDZL05FT"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore(); try{ db.enablePersistence({synchronizeTabs:true}).catch(function(){}); }catch(_){}
const storage = firebase.storage();

const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const escapeHtml = s => (s??'').toString().replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function toast(m,t='ok'){const w=$('#toastWrap');const el=document.createElement('div');el.className='toast '+t;el.textContent=m;w.appendChild(el);setTimeout(()=>{el.style.opacity='0';setTimeout(()=>el.remove(),300);},3200);}

let state = {
  storeId: null, store: null, slug: null,
  products: [], payments: [], reviews: [],
  cart: [], user: null, profile: null,
  currentProduct: null, selectedVariant: null, customFieldValues: {},
  paymentSelected: null,
  checkoutCooldownUntil: 0
};

function getSlug(){
  const p = new URLSearchParams(location.search).get('s');
  if (p) return p;
  const h = location.hash.match(/#\/store\/([^\/]+)/);
  if (h) return h[1];
  return null;
}

/* ---------- Google Sign-In ---------- */
async function ensureUserDoc(user){
  const ref = db.collection('users').doc(user.uid);
  const snap = await ref.get();
  if (!snap.exists){
    await ref.set({
      displayName: user.displayName || '',
      email: user.email || '',
      role: 'buyer',
      photoURL: user.photoURL || '',
      provider: user.providerData?.[0]?.providerId || 'google.com',
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    return { role:'buyer', displayName: user.displayName, photoURL: user.photoURL };
  }
  return snap.data();
}

async function signInWithGoogle(){
  const provider = new firebase.auth.GoogleAuthProvider();
  provider.setCustomParameters({ prompt: 'select_account' });
  const btn = $('#googleBtn');
  if (btn){ btn.disabled = true; }
  try {
    const result = await auth.signInWithPopup(provider);
    await ensureUserDoc(result.user);
    closeAuth();
    toast('أهلًا بك، ' + (result.user.displayName || ''), 'ok');
  } catch(err){
    if (err.code === 'auth/popup-blocked' || err.code === 'auth/operation-not-supported-in-this-environment'){
      toast('يتم تحويلك لجوجل...', 'warn');
      try { await auth.signInWithRedirect(provider); }
      catch(e2){ toast('فشل الدخول: ' + (e2.message||e2.code), 'err'); }
    } else if (err.code === 'auth/popup-closed-by-user' || err.code === 'auth/cancelled-popup-request'){
      /* ignored */
    } else if (err.code === 'auth/account-exists-with-different-credential'){
      toast('هذا البريد مسجل بكلمة مرور. استخدم الدخول بالبريد.', 'warn');
    } else if (err.code === 'auth/unauthorized-domain'){
      toast('النطاق غير مصرح به في Firebase.', 'err');
    } else {
      toast('فشل الدخول: ' + (err.message||err.code), 'err');
    }
  } finally {
    if (btn){ btn.disabled = false; }
  }
}

/* ---------- boot ---------- */
async function boot(){
  state.slug = getSlug();
  if (!state.slug){
    $('#app').innerHTML = '<div class="container"><div class="empty"><div class="icon">🔍</div><h2>لم يتم تحديد متجر</h2><p>عد إلى <a href="index.html">الصفحة الرئيسية</a> لتصفح المتاجر.</p></div></div>';
    return;
  }

  try {
    const q = await db.collection('stores').where('slug','==',state.slug).limit(1).get();
    if (q.empty){
      $('#app').innerHTML = '<div class="container"><div class="empty"><div class="icon">❌</div><h2>المتجر غير موجود</h2><p>قد يكون الرابط غير صحيح.</p></div></div>';
      return;
    }
    const doc = q.docs[0];
    state.storeId = doc.id; state.store = { id: doc.id, ...doc.data() };

    document.body.classList.remove('theme-classic','theme-modern-dark','theme-gaming-grid');
    document.body.classList.add('theme-' + (state.store.theme || 'classic'));
    if (state.store.accentColor && !/^#(0f9d76|4f46e5)$/i.test(state.store.accentColor)) document.body.style.setProperty('--store-accent', state.store.accentColor);
    document.title = state.store.name + ' — سوق السودان';

    if (state.store.status === 'suspended' || state.store.status === 'paused'){
      renderStatusNotice();
      return;
    }

    await Promise.all([loadProducts(), loadPayments(), loadReviews()]);
    loadCartFromStorage();
    renderStore();

    auth.onAuthStateChanged(async u => {
      state.user = u;
      if (u){
        $('#btnAuth').style.display = 'none'; $('#btnLogout').style.display = '';
        const s = await db.collection('users').doc(u.uid).get();
        state.profile = s.exists ? s.data() : { role:'buyer', displayName: u.displayName, photoURL: u.photoURL };
      } else {
        $('#btnAuth').style.display = ''; $('#btnLogout').style.display = 'none';
      }
    });
  } catch(e){
    console.error(e);
    $('#app').innerHTML = '<div class="container"><div class="empty"><div class="icon">⚠️</div><h2>خطأ في التحميل</h2><p>'+escapeHtml(e.message)+'</p></div></div>';
  }
}

function renderStatusNotice(){
  const st = state.store.status;
  const msg = st === 'suspended'
    ? 'تم تعليق هذا المتجر من قبل الإدارة. للتساؤل يرجى التواصل مع الدعم.'
    : 'هذا المتجر متوقف مؤقتًا حاليًا. يرجى العودة لاحقًا.';
  $('#app').innerHTML = `
    <div class="container" style="padding:40px 16px;max-width:640px">
      <div class="card center">
        <img class="avatar-lg" style="margin:0 auto 16px" src="${escapeHtml(state.store.logo||'assets/icons/icon-192.png')}">
        <h1>${escapeHtml(state.store.name)}</h1>
        <p class="store-status-notice ${st==='paused'?'paused':''}">${msg}</p>
        <a href="index.html" class="btn">العودة للرئيسية</a>
      </div>
    </div>`;
}

async function loadProducts(){
  const snap = await db.collection('stores').doc(state.storeId).collection('products').where('active','==',true).get();
  state.products = snap.docs.map(d => ({ id:d.id, ...d.data() }));
}
async function loadPayments(){
  try {
    const snap = await db.collection('stores').doc(state.storeId).collection('payments').where('active','==',true).get();
    state.payments = snap.docs.map(d => ({ id:d.id, ...d.data() }));
  } catch(e){ state.payments = []; }
}
async function loadReviews(){
  try {
    const snap = await db.collection('stores').doc(state.storeId).collection('reviews').orderBy('createdAt','desc').limit(20).get();
    state.reviews = snap.docs.map(d => d.data());
  } catch(e){ state.reviews = []; }
}

function renderStore(){
  const s = state.store;
  const avgRating = state.reviews.length ? (state.reviews.reduce((a,r)=>a+(r.rating||0),0)/state.reviews.length).toFixed(1) : null;

  $('#app').innerHTML = `
    <div class="store-hero">
      <div class="container">
        <img class="avatar avatar-lg" src="${escapeHtml(s.logo||'assets/icons/icon-192.png')}" onerror="this.src='assets/icons/icon-192.png'">
        <div style="flex:1;min-width:0">
          <h1>${escapeHtml(s.name)} ${s.verified?'<span class="badge badge-verified" style="vertical-align:middle">✔ موثّق</span>':''}</h1>
          <p class="bio">${escapeHtml(s.bio||'')}</p>
          <div class="meta">
            <span class="status-pill">${s.category||'متجر عام'}</span>
            ${avgRating?`<span>⭐ ${avgRating} (${state.reviews.length} تقييم)</span>`:''}
            <span>💵 العملة: ${escapeHtml(s.currency||'SDG')}</span>
          </div>
        </div>
      </div>
    </div>
    <div class="container">
      <div class="row-between mb-2">
        <h2 style="margin:0">المنتجات</h2>
        <div class="row"><button class="btn btn-ghost btn-sm" onclick="openReport()">🚩 إبلاغ</button></div>
      </div>
      <div id="productsWrap"></div>
      <h2 class="mt-3 mb-2">تقييمات العملاء</h2>
      <div class="card mb-3">
        <div id="reviewsWrap"></div>
        ${state.user ? `<button class="btn btn-outline btn-sm mt-2" onclick="openReview()">أضف تقييمك</button>` : `<p class="small muted mt-2 mb-0">سجّل الدخول لتتمكن من التقييم.</p>`}
      </div>
    </div>`;
  renderProducts();
  renderReviews();
  updateCartUI();
}

function renderProducts(){
  const wrap = $('#productsWrap');
  if (!state.products.length){ wrap.innerHTML = '<div class="empty"><div class="icon">📦</div><h3>لا توجد منتجات بعد</h3></div>'; return; }
  wrap.innerHTML = `<div class="products-grid">${state.products.map(p => {
    const typeLabel = { digital_file:'ملف رقمي', game_topup:'شحن/اشتراك', code_stock:'كود', physical_or_custom:'منتج' }[p.type] || 'منتج';
    const outOfStock = p.type === 'code_stock' && (p.availableCodes||0) <= 0;
    const price = p.type === 'game_topup' && p.variants?.length
      ? `من ${fmtMoney(Math.min(...p.variants.map(v=>+v.price)), state.store.currency)}`
      : fmtMoney(p.price, state.store.currency);
    return `<div class="product-card ${outOfStock?'out-of-stock':''}">
      <div class="thumb">
        <span class="type-tag">${typeLabel}</span>
        <img src="${escapeHtml(p.image||'')}" alt="" onerror="this.style.display='none'">
      </div>
      <div class="body">
        <h3>${escapeHtml(p.name)}</h3>
        <p class="desc">${escapeHtml(p.description||'')}</p>
        ${p.type==='code_stock' && (p.availableCodes||0) <= (p.lowStockThreshold||3) && (p.availableCodes||0) > 0 ? `<span class="stock-low">⚠️ كمية محدودة (${p.availableCodes})</span>`:''}
        ${outOfStock?'<span class="stock-low">نفدت الكمية</span>':''}
        <div class="row-between" style="margin-top:auto"><strong class="price">${price}</strong></div>
        <div class="actions">
          <button class="btn btn-outline" onclick="quickBuy('${p.id}')">شراء سريع</button>
          <button class="btn" onclick="addToCart('${p.id}')">أضف للسلة</button>
        </div>
      </div>
    </div>`;
  }).join('')}</div>`;
}

function renderReviews(){
  const w = $('#reviewsWrap');
  if (!state.reviews.length){ w.innerHTML = '<p class="muted small mb-0">لا توجد تقييمات بعد. كن أول من يقيّم!</p>'; return; }
  w.innerHTML = state.reviews.map(r => `
    <div class="review">
      <div class="who">
        <div class="avatar avatar-sm" style="display:grid;place-items:center;background:var(--brand-light);color:var(--brand-dark);font-weight:800">${escapeHtml((r.buyerName||'؟')[0])}</div>
        <span class="name">${escapeHtml(r.buyerName||'عميل')}</span>
        <span class="stars">${'★'.repeat(r.rating||0)}${'☆'.repeat(5-(r.rating||0))}</span>
      </div>
      <p class="small mb-0">${escapeHtml(r.comment||'')}</p>
    </div>`).join('');
}

function fmtMoney(amount, currency){
  const cur = currency || 'SDG';
  const n = Number(amount)||0;
  return n.toLocaleString('en-US') + ' ' + cur;
}

function loadCartFromStorage(){
  try {
    const raw = localStorage.getItem('cart_'+state.storeId);
    state.cart = raw ? JSON.parse(raw) : [];
  } catch(e){ state.cart = []; }
}
function saveCart(){
  localStorage.setItem('cart_'+state.storeId, JSON.stringify(state.cart));
  updateCartUI();
}
function addToCart(productId){
  const p = state.products.find(x => x.id === productId);
  if (!p) return;
  if (p.type === 'game_topup' && p.variants?.length) return quickBuy(productId);
  const key = productId + '::';
  const existing = state.cart.find(i => i.key === key);
  if (existing) existing.qty += 1;
  else state.cart.push({ key, productId, variant:null, qty:1, custom:{} });
  saveCart();
  toast('تمت الإضافة إلى السلة','ok');
}
function updateCartUI(){
  const totalItems = state.cart.reduce((a,i)=>a+i.qty,0);
  $('#cartCount').textContent = totalItems;
  $('#cartFab').style.display = totalItems > 0 ? 'flex' : 'none';
  $('#cartToggle').style.display = totalItems > 0 ? 'inline-grid' : 'none';
}
function openCart(){ $('#cartDrawer').classList.add('show'); renderCartItems(); }
function closeCart(){ $('#cartDrawer').classList.remove('show'); }

function renderCartItems(){
  const w = $('#cartItems');
  if (!state.cart.length){ w.innerHTML = '<div class="empty"><div class="icon">🛒</div><p>سلتك فارغة</p></div>'; $('#cartTotal').textContent = '0'; return; }
  let total = 0;
  w.innerHTML = state.cart.map((item,i) => {
    const p = state.products.find(x=>x.id===item.productId);
    if (!p) return '';
    let price = +p.price||0;
    if (item.variant && p.variants){ const v = p.variants.find(v=>v.name===item.variant); if (v) price = +v.price; }
    total += price * item.qty;
    return `<div class="cart-item">
      <div class="thumb"><img src="${escapeHtml(p.image||'')}" onerror="this.style.display='none'"></div>
      <div style="flex:1;min-width:0">
        <strong class="small">${escapeHtml(p.name)}</strong>
        ${item.variant?`<div class="tiny muted">${escapeHtml(item.variant)}</div>`:''}
        <div class="row-between" style="margin-top:4px">
          <div class="qty">
            <button onclick="changeQty(${i},-1)">−</button>
            <span>${item.qty}</span>
            <button onclick="changeQty(${i},1)">+</button>
          </div>
          <strong class="small">${fmtMoney(price*item.qty, state.store.currency)}</strong>
        </div>
        <button class="btn btn-ghost btn-sm" style="padding:2px 6px;color:var(--danger)" onclick="removeCartItem(${i})">إزالة</button>
      </div>
    </div>`;
  }).join('');
  $('#cartTotal').textContent = fmtMoney(total, state.store.currency);
}
function changeQty(i, d){
  state.cart[i].qty += d;
  if (state.cart[i].qty <= 0) state.cart.splice(i,1);
  saveCart(); renderCartItems();
}
function removeCartItem(i){ state.cart.splice(i,1); saveCart(); renderCartItems(); }

function quickBuy(productId){
  const p = state.products.find(x => x.id === productId);
  if (!p) return;
  state.currentProduct = p;
  state.selectedVariant = p.type === 'game_topup' && p.variants?.length ? p.variants[0].name : null;
  state.customFieldValues = {};
  renderProductModal();
  $('#productModal').classList.add('show');
}

function renderProductModal(){
  const p = state.currentProduct;
  let price = +p.price||0;
  if (state.selectedVariant && p.variants){ const v = p.variants.find(v=>v.name===state.selectedVariant); if (v) price = +v.price; }

  $('#productModalBody').innerHTML = `
    <div class="modal-head"><h3>${escapeHtml(p.name)}</h3><button class="icon-btn" onclick="document.getElementById('productModal').classList.remove('show')">✕</button></div>
    ${p.image?`<img src="${escapeHtml(p.image)}" style="width:100%;border-radius:12px;margin-bottom:14px" onerror="this.style.display='none'">`:''}
    <p class="small muted">${escapeHtml(p.description||'')}</p>
    ${p.type==='game_topup' && p.variants?.length ? `
      <div class="field"><label>اختر الخيار</label>
        <div class="variants">
          ${p.variants.map(v=>`<div class="variant-option ${state.selectedVariant===v.name?'selected':''}" onclick="selectVariant('${escapeHtml(v.name)}')"><span>${escapeHtml(v.name)}</span><strong>${fmtMoney(v.price, state.store.currency)}</strong></div>`).join('')}
        </div>
      </div>`:''}
    ${p.customFields?.length ? `
      <div class="field"><label>بيانات مطلوبة</label>
        ${p.customFields.map(f=>`<input class="input mb-1" placeholder="${escapeHtml(f.label)}${f.required?' *':''}" data-field="${escapeHtml(f.key)}" oninput="state.customFieldValues['${escapeHtml(f.key)}']=this.value">`).join('')}
      </div>`:''}
    <div class="row-between mb-2"><strong>الإجمالي</strong><strong style="color:var(--brand-dark);font-size:1.2rem">${fmtMoney(price, state.store.currency)}</strong></div>
    <button class="btn btn-block" onclick="proceedQuickBuy()">متابعة الدفع</button>`;
}

function selectVariant(name){ state.selectedVariant = name; renderProductModal(); }

function proceedQuickBuy(){
  const p = state.currentProduct;
  if (p.customFields?.length){
    for (const f of p.customFields){
      if (f.required && !state.customFieldValues[f.key]){ toast('الحقل مطلوب: '+f.label,'warn'); return; }
    }
  }
  if (!state.user){ toast('سجّل الدخول للمتابعة','warn'); openAuth(); return; }
  let price = +p.price||0;
  if (state.selectedVariant && p.variants){ const v = p.variants.find(v=>v.name===state.selectedVariant); if (v) price = +v.price; }
  const item = { productId: p.id, name: p.name, type: p.type, variant: state.selectedVariant, qty: 1, price, custom: {...state.customFieldValues} };
  $('#productModal').classList.remove('show');
  openCheckout([item], price);
}

function startCheckout(){
  if (!state.cart.length) return;
  if (!state.user){ toast('سجّل الدخول أولًا','warn'); openAuth(); return; }
  closeCart();
  const items = state.cart.map(ci => {
    const p = state.products.find(x=>x.id===ci.productId);
    let price = +p.price||0;
    if (ci.variant && p.variants){ const v = p.variants.find(v=>v.name===ci.variant); if (v) price = +v.price; }
    return { productId:p.id, name:p.name, type:p.type, variant:ci.variant, qty:ci.qty, price, custom:{...ci.custom} };
  });
  const total = items.reduce((a,i)=>a+i.price*i.qty, 0);
  openCheckout(items, total);
}

function openCheckout(items, total){
  state.paymentSelected = state.payments[0]?.id || null;
  const cooldownKey = 'cooldown_'+state.storeId;
  const until = parseInt(localStorage.getItem(cooldownKey)||'0',10);
  state.checkoutCooldownUntil = until;

  $('#checkoutBody').innerHTML = `
    <div class="modal-head"><h3>إتمام الطلب</h3><button class="icon-btn" onclick="closeCheckout()">✕</button></div>
    <div class="card card-tight mb-2" style="background:var(--surface-2)">
      ${items.map(i=>`<div class="row-between small"><span>${escapeHtml(i.name)}${i.variant?` (${escapeHtml(i.variant)})`:''} ×${i.qty}</span><strong>${fmtMoney(i.price*i.qty, state.store.currency)}</strong></div>`).join('')}
      <hr class="divider" style="margin:10px 0">
      <div class="row-between"><span>الإجمالي</span><strong style="color:var(--brand-dark);font-size:1.1rem">${fmtMoney(total, state.store.currency)}</strong></div>
    </div>
    <h4 class="mt-2 mb-1">اختر وسيلة الدفع</h4>
    <div id="payAccounts"></div>
    <div class="field mt-2"><label>رقم العملية / المرجع (transactionRef) <span style="color:var(--danger)">*</span></label>
      <input class="input" id="txRefInput" placeholder="مثال: 1234567890" oninput="saveDraft('txRef', this.value)">
    </div>
    <div class="field"><label>إرفاق صورة الإيصال (اختياري)</label>
      <label class="dropzone" id="receiptZone">
        <input type="file" accept="image/*" id="receiptInput" onchange="handleReceipt(this.files[0])">
        <div id="receiptLabel">📎 اضغط لرفع صورة الإيصال</div>
      </label>
    </div>
    <div class="field"><label>ملاحظات إضافية</label>
      <textarea class="input" id="orderNotes" oninput="saveDraft('notes', this.value)" placeholder="أي تفاصيل تريد إضافتها..."></textarea>
    </div>
    <button class="btn btn-block btn-lg" id="submitOrderBtn" onclick='submitOrder(${JSON.stringify(items).replace(/'/g,"&apos;")}, ${total})'>تأكيد الطلب</button>
  `;
  renderPayAccounts();
  restoreDraft();
  $('#checkoutModal').classList.add('show');
}

function renderPayAccounts(){
  const w = $('#payAccounts');
  if (!state.payments.length){ w.innerHTML = '<p class="small muted">لم يقم التاجر بإضافة وسائل دفع — تواصل معه مباشرة.</p>'; return; }
  w.innerHTML = state.payments.map(p => `
    <div class="pay-account ${state.paymentSelected===p.id?'selected':''}" onclick="selectPayment('${p.id}')">
      <div class="provider">${providerIcon(p.provider)} ${escapeHtml(p.providerLabel||p.provider)}</div>
      <div class="detail"><span class="beneficiary">${escapeHtml(p.accountNumber||'—')}</span>
        <button class="copy-btn" onclick="copyText(event,'${escapeHtml(p.accountNumber||'')}')">📋 نسخ</button></div>
      ${p.beneficiary?`<div class="detail">المستفيد: ${escapeHtml(p.beneficiary)}</div>`:''}
      ${p.instructions?`<div class="tiny muted">${escapeHtml(p.instructions)}</div>`:''}
    </div>`).join('');
}
function providerIcon(p){ return { bankak:'🏦', fawry:'💳', okash:'📱', mbanking:'🏦', custom:'💠' }[p] || '💠'; }
function selectPayment(id){ state.paymentSelected = id; renderPayAccounts(); }
function copyText(e, text){
  e.stopPropagation();
  navigator.clipboard.writeText(text).then(()=>toast('تم النسخ','ok')).catch(()=>toast('تعذر النسخ','err'));
}

function saveDraft(key, value){
  const drafts = JSON.parse(localStorage.getItem('orderDraft_'+state.storeId)||'{}');
  drafts[key] = value;
  localStorage.setItem('orderDraft_'+state.storeId, JSON.stringify(drafts));
}
function restoreDraft(){
  const drafts = JSON.parse(localStorage.getItem('orderDraft_'+state.storeId)||'{}');
  if (drafts.txRef) $('#txRefInput').value = drafts.txRef;
  if (drafts.notes) $('#orderNotes').value = drafts.notes;
  if (drafts.txRef || drafts.notes) toast('تم استرجاع المسودة السابقة','ok');
}
function clearDraft(){ localStorage.removeItem('orderDraft_'+state.storeId); }

let uploadedReceiptUrl = null;
async function handleReceipt(file){
  if (!file) return;
  if (file.size > 5*1024*1024){ toast('الحد الأقصى 5 ميجابايت','err'); return; }
  $('#receiptLabel').textContent = '⏳ جاري الرفع...';
  try {
    const path = `receipts/${state.storeId}/${state.user.uid}-${Date.now()}-${file.name}`;
    const ref = storage.ref(path);
    const snap = await ref.put(file);
    uploadedReceiptUrl = await snap.ref.getDownloadURL();
    $('#receiptLabel').textContent = '✅ تم رفع الإيصال';
  } catch(e){
    $('#receiptLabel').textContent = '❌ فشل الرفع';
    toast('فشل رفع الإيصال: '+e.message,'err');
  }
}

async function submitOrder(items, total){
  if (!state.paymentSelected && state.payments.length){ toast('اختر وسيلة دفع','warn'); return; }
  const txRef = $('#txRefInput').value.trim();
  if (!txRef){ toast('أدخل رقم العملية','warn'); return; }

  const now = Date.now();
  if (now < state.checkoutCooldownUntil){
    const sec = Math.ceil((state.checkoutCooldownUntil - now)/1000);
    toast(`الرجاء الانتظار ${sec} ثانية قبل طلب جديد`,'warn'); return;
  }

  const btn = $('#submitOrderBtn'); btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> جاري الإرسال';

  try {
    const dup = await db.collection('stores').doc(state.storeId).collection('orders')
      .where('transactionRef','==',txRef).limit(1).get();
    if (!dup.empty){ toast('رقم العملية مستخدم مسبقًا','err'); btn.disabled=false; btn.textContent='تأكيد الطلب'; return; }

    const payment = state.payments.find(p=>p.id===state.paymentSelected);
    const order = {
      buyerUid: state.user.uid,
      buyerName: state.profile?.displayName || state.user.displayName || 'عميل',
      buyerEmail: state.user.email,
      items, total,
      paymentMethod: payment ? (payment.providerLabel||payment.provider) : 'غير محدد',
      paymentAccountId: payment?.id || null,
      transactionRef: txRef,
      receiptUrl: uploadedReceiptUrl || null,
      notes: $('#orderNotes').value.trim() || '',
      status: 'pending',
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    };
    await db.collection('stores').doc(state.storeId).collection('orders').add(order);

    localStorage.setItem('cooldown_'+state.storeId, String(now + 60*1000));
    clearDraft();
    uploadedReceiptUrl = null;
    if (state.cart.length){ state.cart = []; saveCart(); }
    closeCheckout();
    toast('تم إرسال طلبك! سيتم مراجعته من التاجر','ok');
  } catch(e){
    toast('فشل إرسال الطلب: '+e.message,'err');
    btn.disabled=false; btn.textContent='تأكيد الطلب';
  }
}
function closeCheckout(){ $('#checkoutModal').classList.remove('show'); }

function openReview(){ if (!state.user){ openAuth(); return; } $('#reviewModal').classList.add('show'); }
function closeReview(){ $('#reviewModal').classList.remove('show'); }
async function submitReview(){
  const rating = +$('#reviewRating').value;
  const comment = $('#reviewComment').value.trim();
  try {
    await db.collection('stores').doc(state.storeId).collection('reviews').add({
      buyerUid: state.user.uid,
      buyerName: state.profile?.displayName || state.user.displayName || 'عميل',
      rating, comment,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    closeReview(); toast('شكرًا لتقييمك','ok');
    await loadReviews(); renderReviews();
  } catch(e){ toast('فشل: '+e.message,'err'); }
}

function openReport(){ if (!state.user){ openAuth(); return; } $('#reportModal').classList.add('show'); }
function closeReport(){ $('#reportModal').classList.remove('show'); }
async function submitReport(){
  const reason = $('#reportReason').value;
  const details = $('#reportDetails').value.trim();
  try {
    await db.collection('reports').add({
      storeId: state.storeId, storeName: state.store.name,
      reporterUid: state.user.uid, reporterName: state.profile?.displayName || state.user.displayName,
      reason, details, status: 'open',
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    closeReport(); toast('تم إرسال البلاغ للإدارة','ok');
  } catch(e){ toast('فشل: '+e.message,'err'); }
}

function openAuth(){ $('#authModal').classList.add('show'); }
function closeAuth(){ $('#authModal').classList.remove('show'); }
function switchAuthTab(w){
  const isLogin = w==='login';
  $('#tabLogin').classList.toggle('active', isLogin);
  $('#tabRegister').classList.toggle('active', !isLogin);
  $('#loginForm').classList.toggle('hide', !isLogin);
  $('#registerForm').classList.toggle('hide', isLogin);
}
async function doLogin(e){
  e.preventDefault();
  const btn = $('#loginBtn'); btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>';
  try { await auth.signInWithEmailAndPassword($('#loginEmail').value.trim(), $('#loginPassword').value); closeAuth(); toast('أهلًا بك','ok'); }
  catch(e){ toast('فشل: '+e.message,'err'); }
  finally { btn.disabled=false; btn.textContent='دخول'; }
  return false;
}
async function doRegister(e){
  e.preventDefault();
  const btn = $('#regBtn'); btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>';
  try {
    const name = $('#regName').value.trim();
    const cred = await auth.createUserWithEmailAndPassword($('#regEmail').value.trim(), $('#regPassword').value);
    await cred.user.updateProfile({displayName:name});
    await db.collection('users').doc(cred.user.uid).set({displayName:name, email:cred.user.email, role:'buyer', createdAt:firebase.firestore.FieldValue.serverTimestamp()});
    closeAuth(); toast('تم إنشاء الحساب','ok');
  } catch(e){ toast('فشل: '+e.message,'err'); }
  finally { btn.disabled=false; btn.textContent='إنشاء الحساب'; }
  return false;
}
async function doLogout(){ await auth.signOut(); toast('تم الخروج','ok'); }

function updateOnline(){ $('#offlineBanner').classList.toggle('hide', navigator.onLine); }
window.addEventListener('online', updateOnline);
window.addEventListener('offline', updateOnline);
updateOnline();

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});

/* ✅ Handle Google redirect return */
auth.getRedirectResult().then(async (result) => {
  if (result?.user){
    await ensureUserDoc(result.user);
    toast('أهلًا بك، ' + (result.user.displayName || ''), 'ok');
  }
}).catch(err => {
  if (!['auth/no-current-user','auth/redirect-cancelled-by-user','auth/redirect-operation-pending'].includes(err.code)){
    console.warn('Redirect result:', err);
  }
});

boot();
</script>
<script src="js/ui.js"></script>
<script src="js/icons.js"></script>
</body>
