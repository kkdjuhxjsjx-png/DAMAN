<body class="theme-classic"><main id="app"><div class="container">جاري تحميل المتجر...</div></main><div class="toast-wrap" id="toastWrap"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
<script>
const firebaseConfig={apiKey:"AIzaSyAxocPULi4vcrm8t8Q3wYrHQ9oWovHXrV4",authDomain:"daman-7f169.firebaseapp.com",projectId:"daman-7f169",storageBucket:"daman-7f169.firebasestorage.app",messagingSenderId:"981649500667",appId:"1:981649500667:web:7709753041388518b6035e",measurementId:"G-L5PDZL05FT"};firebase.initializeApp(firebaseConfig);const db=firebase.firestore();
const $=s=>document.querySelector(s);function escapeHtml(s){return (s??'').toString().replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
async function boot(){const slug=new URLSearchParams(location.search).get('s');if(!slug){$('#app').innerHTML='<div class="container"><h2>لم يتم تحديد متجر</h2><a href="index.html">العودة للرئيسية</a></div>';return}const q=await db.collection('stores').where('slug','==',slug).limit(1).get();if(q.empty){$('#app').innerHTML='<div class="container"><h2>المتجر غير موجود</h2></div>';return}const doc=q.docs[0],store={id:doc.id,...doc.data()};document.title=store.name+' — سوق السودان';const snap=await db.collection('stores').doc(store.id).collection('products').where('active','==',true).get();const products=snap.docs.map(d=>({id:d.id,...d.data()}));$('#app').innerHTML=`<div class="store-hero"><div class="container"><h1>${escapeHtml(store.name)}</h1><p>${escapeHtml(store.bio||'')}</p></div></div><div class="container"><div class="grid grid-3">${products.map(p=>`<div class="card"><h3>${escapeHtml(p.name)}</h3><p>${escapeHtml(p.description||'')}</p><strong>${p.price||0} ${escapeHtml(store.currency||'SDG')}</strong></div>`).join('')||'<p>لا توجد منتجات بعد</p>'}</div></div>`}boot();
</script>
<script src="ui.js"></script><script src="icons.js"></script>
