
name: Extract STORE-v4 ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract website files
        run: |
          set -e

          ZIP_FILE="STORE-v4.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: STORE-v4.zip not found"
            exit 1
          fi

          mkdir -p extracted

          unzip -q "$ZIP_FILE" -d extracted

          echo "Extracted archive contents:"
          ls -la extracted

          ITEMS=$(find extracted -mindepth 1 -maxdepth 1 | wc -l)

          if [ "$ITEMS" -eq 1 ] && [ -d "$(find extracted -mindepth 1 -maxdepth 1 -type d)" ]; then
            SOURCE_DIR="$(find extracted -mindepth 1 -maxdepth 1 -type d)"
          else
            SOURCE_DIR="extracted"
          fi

          cp -a "$SOURCE_DIR"/. .

          rm -rf extracted

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No new files to commit."
          else
            git commit -m "Extract STORE-v4 website files"
            git push
          fi
